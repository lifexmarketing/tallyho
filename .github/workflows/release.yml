name: Release

# Push a tag like v1.0.1 to publish a release. The tag must point at a commit
# on main and match both the Version header and TALLYHO_VERSION in tallyho.php.
# The attached tallyho.zip is what every WordPress site installs, so the job
# runs in the "release" environment: add required reviewers to it in
# Settings → Environments, and protect v* tags in Settings → Rules.
#
# Third-party actions are pinned to commit SHAs because this job holds a
# write token. Comments note the tag each SHA came from.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Tag must be on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME is not on main. Releases must come from main." >&2
            exit 1
          fi

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '7.4'

      - name: Lint PHP
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Run tests
        run: |
          npm install --no-save jsdom@24
          node tests/listener.test.mjs
          php tests/plugin.test.php

      - name: Check version numbers match the tag
        run: bin/check-version.sh "${GITHUB_REF_NAME#v}"

      - name: Write release notes
        run: |
          bin/release-notes.sh "${GITHUB_REF_NAME#v}" > release-notes.md
          if ! grep -q '[^[:space:]]' <(sed '/^Requires\|^Tested/d' release-notes.md); then
            echo "No CHANGELOG.md section for ${GITHUB_REF_NAME#v}." >&2
            exit 1
          fi
          cat release-notes.md

      - name: Build zip
        run: bin/build-zip.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/tallyho.zip \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md
